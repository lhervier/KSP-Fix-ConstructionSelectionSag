// Read once when KSP starts: quit KSP, edit this file, start KSP again.

// Holds a landed vessel still while one of its parts is selected with the Move or Rotate tool of EVA construction mode.
// On stock, the selected part no longer bears any weight, and the vessel sits down on it at the first jolt (a time
// warp, the vessel settling after a load): it leans or tips over, the part stuck in the ground.
holdVesselStill = True

// How much the mod writes to KSP.log: Error, Warning, Info or Debug. At Debug, one line each time a vessel is held or
// let go, and one when a held vessel goes on rails with no ground contact.
logLevel = Info
